name: CI

on:
  push:
    branches: [master, feature]
  pull_request:
    branches: [master]

# 质量门：typecheck / build / test。lint 暂未纳入（既有 111 个 any warning +
# 一个 typescript-eslint 误报 IMetrics unused 的诡异 error），治理后追加 lint job。
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
